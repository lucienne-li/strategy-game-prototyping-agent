[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "strategy-game-prototyping-agent"
version = "0.2.0"
description = "Python-first runtime and evaluation pipeline for a strategy-game prototyping coding agent"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
browser = ["playwright==1.62.0"]
dev = ["ruff>=0.9,<1"]

[project.scripts]
strategy-game-agent = "strategy_game_agent.cli:main"

[tool.setuptools.packages.find]
include = ["strategy_game_agent*"]

[tool.ruff]
line-length = 140
target-version = "py311"
